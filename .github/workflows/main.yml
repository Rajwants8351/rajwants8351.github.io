name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A9E2FC: ${{ secrets.A9E2FC }}
          BBA65A: ${{ secrets.BBA65A }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A9E2FC', '')
          k2 = os.environ.get('BBA65A', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- dc859e49fb8c92b3c07b911fa363f33316 -->', k1) if k1 else txt
          out = out.replace('<!-- e1744385503382b22d224760d48f7fae42138c3e5d3f88 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
